<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 750px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    
    .chat-layout { display: flex; gap: 16px; height: 420px; }
    .users-panel {
      width: 160px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
    }
    .users-panel h3 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .user-list { list-style: none; overflow-y: auto; font-size: 0.85rem; }
    .user-list li { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }

    .main-chat { flex-grow: 1; display: flex; flex-direction: column; }
    
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .chat-header h2 { font-size: 1.2rem; color: #38bdf8; font-weight: 700; }
    
    .header-actions { display: flex; gap: 6px; }
    .action-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn.active { background: #0284c7; }
    .action-btn.danger { background: #991b1b; color: #fca5a5; }

    .search-bar {
      margin-bottom: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    button.primary-btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      position: relative;
    }
    .msg-wrapper.me { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.88rem;
      position: relative;
    }
    .msg.me { background: #0284c7; color: #fff; }
    .msg.them { background: #334155; color: #f8fafc; }
    
    .reply-quote {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid #38bdf8;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .reactions-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .reaction-pill {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .msg-actions {
      display: none;
      gap: 4px;
      font-size: 0.75rem;
    }
    .msg-wrapper:hover .msg-actions { display: flex; }
    .action-icon { cursor: pointer; opacity: 0.7; }
    .action-icon:hover { opacity: 1; }

    .system-msg { text-align: center; font-size: 0.75rem; color: #64748b; }
    #typing-indicator { font-size: 0.75rem; font-style: italic; color: #94a3b8; height: 16px; }

    .reply-preview {
      display: none;
      background: #1e293b;
      padding: 6px 12px;
      font-size: 0.75rem;
      border-left: 3px solid #0284c7;
      justify-content: space-between;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .input-row { display: flex; gap: 8px; position: relative; }
    .input-row input { margin-bottom: 0; flex-grow: 1; }
  </style>
</head>
<body>

  <div class="card" id="setup" style="max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 16px; color: #38bdf8;">Join Private Chat</h2>
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="room" placeholder="Room Name">
    <input type="password" id="room-pass" placeholder="Room Passcode (Optional)">
    <button class="primary-btn" onclick="joinRoom()">Join Room</button>
  </div>

  <div class="card" id="chat" style="display:none;">
    <div class="chat-header">
      <h2 id="room-title">Room</h2>
      <div class="header-actions">
        <button class="action-btn active" id="sound-btn" onclick="toggleSound()">🔊 Sound</button>
        <button class="action-btn" onclick="requestNotificationPermission()">🔔 Alerts</button>
        <button class="action-btn danger" onclick="deleteAllMessages()">Clear All</button>
        <button class="action-btn" onclick="location.reload()">Logout</button>
      </div>
    </div>

    <input type="text" class="search-bar" id="search-input" placeholder="Search room messages..." oninput="filterMessages()">
    
    <div class="chat-layout">
      <div class="users-panel">
        <h3>Members (<span id="user-count">0</span>)</h3>
        <ul class="user-list" id="user-list"></ul>
      </div>

      <div class="main-chat">
        <div id="chat-box"></div>
        <div id="typing-indicator"></div>
        
        <div class="reply-preview" id="reply-preview">
          <span id="reply-text">Replying...</span>
          <span style="cursor:pointer;" onclick="cancelReply()">✕</span>
        </div>

        <div class="input-row">
          <input type="text" id="message-input" placeholder="Type a message...">
          <button class="primary-btn" style="width: auto;" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = '', myName = '', replyTarget = null;
    let soundEnabled = true, notificationsAllowed = false;
    let typingTimeout;

    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').classList.toggle('active', soundEnabled);
    }

    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            notificationsAllowed = true;
            alert("Desktop notifications enabled!");
          }
        });
      }
    }

    function joinRoom() {
      myName = document.getElementById('username').value.trim();
      currentRoom = document.getElementById('room').value.trim();
      const pass = document.getElementById('room-pass').value.trim();
      if (myName && currentRoom) {
        socket.emit('join-room', { room: currentRoom, password: pass, username: myName });
      }
    }

    socket.on('join-error', (msg) => alert(msg));

    socket.on('load-history', (messages) => {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('chat').style.display = 'flex';
      document.getElementById('room-title').textContent = currentRoom;
      document.getElementById('chat-box').innerHTML = '';
      messages.forEach(msg => appendMessage(msg, false));
    });

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (text) {
        socket.emit('send-message', { 
          room: currentRoom, 
          text: text, 
          sender: myName,
          replyTo: replyTarget ? replyTarget.text : null 
        });
        input.value = '';
        socket.emit('stop-typing', { room: currentRoom });
        cancelReply();
      }
    }

    // --- ENTER KEY AND TYPING EVENT LISTENERS ---
    const msgInput = document.getElementById('message-input');
    
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    msgInput.addEventListener('input', () => {
      socket.emit('typing', { room: currentRoom, username: myName });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { room: currentRoom });
      }, 2000);
    });

    socket.on('user-typing', (username) => {
      document.getElementById('typing-indicator').textContent = `${username} is typing...`;
    });

    socket.on('user-stopped-typing', () => {
      document.getElementById('typing-indicator').textContent = '';
    });
    // ------------------------------------------

    function setReply(text) {
      replyTarget = { text };
      document.getElementById('reply-text').textContent = `Replying to: "${text.substring(0, 30)}..."`;
      document.getElementById('reply-preview').style.display = 'flex';
    }

    function cancelReply() {
      replyTarget = null;
      document.getElementById('reply-preview').style.display = 'none';
    }

    function toggleReaction(messageId, emoji) {
      socket.emit('toggle-reaction', { messageId, emoji, username: myName, room: currentRoom });
    }

    function filterMessages() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const msgs = document.querySelectorAll('.msg-wrapper');
      msgs.forEach(m => {
        const text = m.querySelector('.msg-body').textContent.toLowerCase();
        m.style.display = text.includes(query) ? 'flex' : 'none';
      });
    }

    function deleteAllMessages() {
      if (confirm("Clear all messages for everyone?")) {
        socket.emit('delete-all-messages', currentRoom);
      }
    }

    socket.on('receive-message', (data) => {
      const isFromSomeoneElse = data.sender !== myName;
      appendMessage(data, isFromSomeoneElse);

      if (isFromSomeoneElse && notificationsAllowed && document.hidden) {
        new Notification(`New message from ${data.sender}`, { body: data.text });
      }
    });

    socket.on('reaction-updated', ({ messageId, reactions }) => {
      const msgEl = document.getElementById(`msg-${messageId}`);
      if (!msgEl) return;
      const reactionsBox = msgEl.querySelector('.reactions-bar');
      reactionsBox.innerHTML = '';
      
      const counts = {};
      reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
      
      Object.entries(counts).forEach(([emoji, count]) => {
        const pill = document.createElement('span');
        pill.className = 'reaction-pill';
        pill.textContent = `${emoji} ${count}`;
        pill.onclick = () => toggleReaction(messageId, emoji);
        reactionsBox.appendChild(pill);
      });
    });

    socket.on('update-user-list', (users) => {
      const ul = document.getElementById('user-list');
      document.getElementById('user-count').textContent = users.length;
      ul.innerHTML = users.map(u => `<li><span class="status-dot"></span>${u}</li>`).join('');
    });

    socket.on('system-message', (text) => {
      const box = document.getElementById('chat-box');
      const sysEl = document.createElement('div');
      sysEl.className = 'system-msg';
      sysEl.textContent = text;
      box.appendChild(sysEl);
      box.scrollTop = box.scrollHeight;
    });

    socket.on('all-messages-deleted', () => document.getElementById('chat-box').innerHTML = '');
    socket.on('message-deleted', id => document.getElementById(`msg-${id}`)?.remove());

    function appendMessage({ id, sender, text, replyTo, reactions, time }, playSound = false) {
      const box = document.getElementById('chat-box');
      const isMe = sender === myName;
      
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;
      wrapper.id = `msg-${id}`;

      wrapper.innerHTML = `
        <div class="avatar" style="background:${getColor(sender)}">${sender.charAt(0)}</div>
        <div class="msg ${isMe ? 'me' : 'them'}">
          ${replyTo ? `<div class="reply-quote">↩ ${replyTo}</div>` : ''}
          <div style="font-size:0.7rem; font-weight:600; opacity:0.8">${sender}</div>
          <div class="msg-body">${text}</div>
          <div class="reactions-bar"></div>
          <div style="font-size:0.65rem; text-align:right; opacity:0.6; margin-top:2px">${time}</div>
        </div>
        <div class="msg-actions">
          <span class="action-icon" onclick="setReply('${text.replace(/'/g, "\\'")}')">↩️</span>
          <span class="action-icon" onclick="toggleReaction('${id}', '❤️')">❤️</span>
          <span class="action-icon" onclick="toggleReaction('${id}', '👍')">👍</span>
          ${isMe ? `<span class="action-icon" onclick="socket.emit('delete-message', {messageId:'${id}', room:currentRoom})">🗑️</span>` : ''}
        </div>
      `;

      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      if (playSound) playNotificationSound();
    }

    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return `hsl(${Math.abs(hash) % 360}, 60%, 45%)`;
    }
  </script>
</body>
</html>
