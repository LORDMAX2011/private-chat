<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 460px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    h2 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #38bdf8; font-weight: 700; }
    
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
    button:active { transform: scale(0.98); }

    /* Scrollbar */
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    #chat-box {
      height: 350px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 8px;
    }
    
    /* Animations & Bubbles */
    .msg-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .msg-wrapper.me { flex-direction: row-reverse; }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .msg {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.me {
      background: #0284c7;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg.them {
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }
    .msg .sender { font-size: 0.72rem; font-weight: 600; margin-bottom: 2px; opacity: 0.85; }
    .msg .time { font-size: 0.65rem; text-align: right; margin-top: 4px; opacity: 0.7; }

    .system-msg {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin: 4px 0;
      font-style: italic;
    }

    #typing-indicator {
      font-size: 0.8rem;
      font-style: italic;
      color: #94a3b8;
      height: 18px;
      margin-bottom: 6px;
      padding-left: 5px;
    }

    .input-row { display: flex; gap: 8px; position: relative; }
    .input-row input { margin-bottom: 0; flex-grow: 1; }
    
    .emoji-btn {
      background: #334155;
      padding: 0 12px;
      border-radius: 10px;
    }
    .emoji-picker {
      display: none;
      position: absolute;
      bottom: 50px;
      right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px;
      gap: 6px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .emoji-picker span { font-size: 1.3rem; cursor: pointer; padding: 4px; border-radius: 6px; }
    .emoji-picker span:hover { background: #334155; }
  </style>
</head>
<body>

  <div class="card" id="setup">
    <h2>Private Chat</h2>
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="room" placeholder="Secret Room ID (e.g., room-123)">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div class="card" id="chat" style="display:none;">
    <h2 id="room-title">Room</h2>
    <div id="chat-box"></div>
    <div id="typing-indicator"></div>
    
    <div class="input-row">
      <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
      <input type="text" id="message-input" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>

      <div class="emoji-picker" id="emoji-picker">
        <span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('❤️')">❤️</span>
        <span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('🔥')">🔥</span>
        <span onclick="addEmoji('🎉')">🎉</span>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = '', myName = '';
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    const emojiPicker = document.getElementById('emoji-picker');
    let typingTimeout;

    function joinRoom() {
      myName = document.getElementById('username').value.trim();
      currentRoom = document.getElementById('room').value.trim();
      if (myName && currentRoom) {
        document.getElementById('room-title').textContent = currentRoom;
        socket.emit('join-room', { room: currentRoom, username: myName });
        document.getElementById('setup').style.display = 'none';
        document.getElementById('chat').style.display = 'flex';
      }
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('send-message', { room: currentRoom, text: text, sender: myName });
        messageInput.value = '';
        socket.emit('stop-typing', { room: currentRoom });
        emojiPicker.style.display = 'none';
      }
    }

    function toggleEmojiPicker() {
      emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
    }

    function addEmoji(emoji) {
      messageInput.value += emoji;
      messageInput.focus();
    }

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener('input', () => {
      socket.emit('typing', { room: currentRoom, username: myName });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { room: currentRoom });
      }, 2000);
    });

    socket.on('user-typing', (username) => {
      typingIndicator.textContent = `${username} is typing...`;
    });

    socket.on('user-stopped-typing', () => {
      typingIndicator.textContent = '';
    });

    socket.on('system-message', (text) => {
      const box = document.getElementById('chat-box');
      const sysEl = document.createElement('div');
      sysEl.className = 'system-msg';
      sysEl.textContent = text;
      box.appendChild(sysEl);
      box.scrollTop = box.scrollHeight;
    });

    socket.on('load-history', (messages) => {
      document.getElementById('chat-box').innerHTML = '';
      messages.forEach((msg) => appendMessage(msg));
    });

    socket.on('receive-message', (data) => {
      appendMessage(data);
    });

    function appendMessage({ sender, text, time }) {
      const box = document.getElementById('chat-box');
      const isMe = sender === myName;
      const initial = sender ? sender.charAt(0) : '?';
      
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;

      wrapper.innerHTML = `
        <div class="avatar" style="background-color: ${getColor(sender)}">${initial}</div>
        <div class="msg ${isMe ? 'me' : 'them'}">
          <div class="sender">${isMe ? 'You' : sender}</div>
          <div>${text}</div>
          <div class="time">${time || ''}</div>
        </div>
      `;
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    }

    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return `hsl(${Math.abs(hash) % 360}, 65%, 50%)`;
    }
  </script>
</body>
</html>
