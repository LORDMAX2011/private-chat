<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Private Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>Private Chat</h2>

  <div id="setup">
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="room" placeholder="Secret Room ID (e.g., room-123)">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div id="chat" style="display:none;">
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = '', myName = '';

    function joinRoom() {
      myName = document.getElementById('username').value;
      currentRoom = document.getElementById('room').value;
      if (myName && currentRoom) {
        // Updated to pass an object with room and username to match server logic
        socket.emit('join-room', { room: currentRoom, username: myName });
        document.getElementById('setup').style.display = 'none';
        document.getElementById('chat').style.display = 'block';
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value;
      if (text) {
        // Updated payload keys to match backend schema (room, text, sender)
        socket.emit('send-message', { room: currentRoom, text: text, sender: myName });
        input.value = '';
      }
    }

    // Load past message history sent by MongoDB on join
    socket.on('load-history', (messages) => {
      messages.forEach((msg) => {
        const prefix = (msg.sender === myName) ? 'You' : msg.sender;
        appendMessage(`${prefix}: ${msg.text}`);
      });
    });

    // Listen for incoming live messages
    socket.on('receive-message', (data) => {
      const prefix = (data.sender === myName) ? 'You' : data.sender;
      appendMessage(`${prefix}: ${data.text}`);
    });

    function appendMessage(text) {
      const box = document.getElementById('chat-box');
      const msgEl = document.createElement('p');
      msgEl.textContent = text;
      box.appendChild(msgEl);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
