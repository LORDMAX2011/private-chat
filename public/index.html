<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    h2 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
    
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }

    #chat-box {
      height: 320px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.me {
      align-self: flex-end;
      background: #0284c7;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg.them {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }
    .msg .sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; opacity: 0.8; }
    .msg .time { font-size: 0.65rem; text-align: right; margin-top: 4px; opacity: 0.7; }

    #typing-indicator {
      font-size: 0.85rem;
      font-style: italic;
      color: #94a3b8;
      height: 20px;
      margin-bottom: 5px;
    }
    .input-row { display: flex; gap: 8px; }
    .input-row input { margin-bottom: 0; }
    .input-row button { width: auto; padding: 0 20px; }
  </style>
</head>
<body>

  <div class="card" id="setup">
    <h2>Private Chat</h2>
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="room" placeholder="Secret Room ID (e.g., room-123)">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div class="card" id="chat" style="display:none;">
    <h2 id="room-title">Room</h2>
    <div id="chat-box"></div>
    <div id="typing-indicator"></div>
    <div class="input-row">
      <input type="text" id="message-input" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = '', myName = '';
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    let typingTimeout;

    function joinRoom() {
      myName = document.getElementById('username').value.trim();
      currentRoom = document.getElementById('room').value.trim();
      if (myName && currentRoom) {
        document.getElementById('room-title').textContent = currentRoom;
        socket.emit('join-room', { room: currentRoom, username: myName });
        document.getElementById('setup').style.display = 'none';
        document.getElementById('chat').style.display = 'flex';
      }
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('send-message', { room: currentRoom, text: text, sender: myName });
        messageInput.value = '';
        socket.emit('stop-typing', { room: currentRoom });
      }
    }

    // Enter key event listener to send messages
    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });

    // Handle typing notification events
    messageInput.addEventListener('input', () => {
      socket.emit('typing', { room: currentRoom, username: myName });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { room: currentRoom });
      }, 2000);
    });

    socket.on('user-typing', (username) => {
      typingIndicator.textContent = `${username} is typing...`;
    });

    socket.on('user-stopped-typing', () => {
      typingIndicator.textContent = '';
    });

    // History & message rendering handlers
    socket.on('load-history', (messages) => {
      document.getElementById('chat-box').innerHTML = '';
      messages.forEach((msg) => appendMessage(msg));
    });

    socket.on('receive-message', (data) => {
      appendMessage(data);
    });

    function appendMessage({ sender, text, time }) {
      const box = document.getElementById('chat-box');
      const msgEl = document.createElement('div');
      const isMe = sender === myName;
      
      msgEl.className = `msg ${isMe ? 'me' : 'them'}`;
      msgEl.innerHTML = `
        <div class="sender">${isMe ? 'You' : sender}</div>
        <div>${text}</div>
        <div class="time">${time || ''}</div>
      `;
      box.appendChild(msgEl);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
